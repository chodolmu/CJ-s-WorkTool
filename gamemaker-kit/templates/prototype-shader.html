<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{MILESTONE_NAME}} — gamemaker-kit prototype</title>
<!--
gamemaker-kit milestone: {{MILESTONE_ID}}
Pillars targeted: {{PILLARS}}
Hypothesis:
  IF   {{HYP_IF}}
  THEN {{HYP_THEN}}
  MEASURED BY:
{{HYP_MEASURED_BY}}
Created: {{CREATED_AT}}
Shape: shader

SHADER TEMPLATE — intentionally minimal. Single fullscreen fragment shader, a
uniform clock, 1-axis interaction. The bot hook binds the standard 5-callback
spec, but the bot verdict for shape='shader' is INCONCLUSIVE by design — bots
cannot judge visual fun. /gmk-validate records bot metrics (action_entropy,
duration) but defers verdict to /gmk-self-test. See gmk-prototype-rules Rule 11
and CONCEPT.md §15. To get an objective scalar beyond "ran 60s without crash",
add a domain metric to summary.score (interaction count, scroll distance, etc).

PORTING: shader prototypes port to GDShader / HLSL with 1:1 uniform mapping, but
tunable feel numbers (MIX_STEP, trail decay) need re-tuning on the target
engine. gmk-portability-check Stage 4 flags shader prototypes for visual diff in
addition to numeric diff.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #ddd; font-family: monospace; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: block; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,0.5); padding: 8px 10px;
         border-radius: 4px; font-size: 12px; opacity: 0.75; pointer-events: none; line-height: 1.5; }
  #hud span { margin-right: 12px; }
  #hint { position: absolute; left: 12px; bottom: 12px; font-size: 11px; opacity: 0.4; pointer-events: none; }
  #err { position: absolute; left: 12px; top: 80px; background: rgba(150,0,0,0.85); padding: 8px 10px;
         border-radius: 4px; font-size: 11px; max-width: 70vw; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hud">
    <span>t: <b id="t">0.00</b>s</span>
    <span>x: <b id="x">0.50</b></span>
    <span>interactions: <b id="interactions">0</b></span>
    <span>status: <b id="status">running</b></span>
  </div>
  <div id="hint">Drag horizontally, or scroll, to drive uMix. Bot drives via window.__gmk_botHook__.</div>
  <div id="err"></div>
</div>

<script src="./_bot_hook_lib.js"></script>
<script>
// GAME LOGIC — shader shape. Edit ONLY the marked sections; bot hook at bottom binds to these.
// Bot verdict is INCONCLUSIVE by design (see header).

// Tunable constants (feel knobs)
const RUN_SECONDS = 60;     // bot run length (also human session cap)
const MAX_ACTIONS = 5000;   // safety: bot can't loop forever
const MIX_STEP    = 0.05;   // change to uMix per 'left' / 'right' action
const TICK_ACTION = 1.0;    // change to uTime per 'tick' action

// Single source of truth. Render reads; bot reads via legalActions/collectSummary; input writes via apply.
let state = null;

function newState(seed, rng) {
  return {
    seed,
    started_ms: 0,        // wall clock at startGame; lib injects via reset()
    sim_ms: 0,            // bot-driven simulated time; advances on 'tick'
    mix: 0.5,             // [0..1] driven uniform — the interaction axis
    trail: 0.5,           // smoothed mix (visual)
    interactions: 0,      // count of non-'tick' actions
    over: false,
    over_reason: null,
  };
}

// Bot actions: {type:'left'} decrease mix, {type:'right'} increase mix, {type:'tick'} advance sim time.
// The "decision" a shader prototype offers is the interaction:tick ratio; action_entropy reads it.
// That's the only objective signal — score stays 0 unless implementer adds one.

function computeLegalActions(s) {
  if (s.over) return [];
  return [{ type: 'left' }, { type: 'right' }, { type: 'tick' }];
}

function applyAction(s, action) {
  if (action.type === 'left') {
    s.mix = Math.max(0, s.mix - MIX_STEP);
    s.interactions++;
  } else if (action.type === 'right') {
    s.mix = Math.min(1, s.mix + MIX_STEP);
    s.interactions++;
  } else if (action.type === 'tick') {
    s.sim_ms += TICK_ACTION * 16;  // ~1 frame at 60fps
  } else {
    throw new Error('unknown action type: ' + action.type);
  }
  s.trail += (s.mix - s.trail) * 0.15;
  if (s.sim_ms >= RUN_SECONDS * 1000 || s.interactions + s.sim_ms / 16 > MAX_ACTIONS) {
    s.over = true;
    s.over_reason = s.sim_ms >= RUN_SECONDS * 1000 ? 'time-up' : 'action-cap';
  }
}

function summarize(s) {
  // Score stays 0 for shader unless implementer adds a domain scalar.
  // /gmk-validate reads custom.* to compute action_entropy and state_coverage.
  return {
    score: 0,
    custom: {
      interactions: s.interactions,
      sim_seconds: s.sim_ms / 1000,
      final_mix: s.mix,
      over_reason: s.over_reason,
      // state_coverage proxy: distinct mix bins visited (10-bin partition, full = 10)
      mix_bin_visits: s.mix_bin_visits || 0,
    },
  };
}

// SHADER (vanilla WebGL2). One fullscreen triangle, one fragment shader.
// Uniforms: uTime (wall-clock seconds), uMix (state.trail — smoothed axis), uRes (viewport px).
// Edit FRAG_SRC freely; keep uniform names — bot hook depends on the interaction surface, not shader contents.

const VERT_SRC = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG_SRC = `#version 300 es
precision highp float;
in vec2 vUv;
uniform float uTime; uniform float uMix; uniform vec2 uRes;
out vec4 outColor;
// REPLACE THE BODY BELOW WITH YOUR VISUAL HYPOTHESIS.
// Default: placeholder gradient responding to uMix and uTime.
void main() {
  vec2 p = (vUv * 2.0 - 1.0) * vec2(uRes.x / uRes.y, 1.0);
  float r = length(p); float a = atan(p.y, p.x);
  float band = sin(a * 6.0 + uTime * 0.6) * 0.5 + 0.5;
  float ring = smoothstep(0.5, 0.5 + 0.02, mix(0.3, 0.8, uMix) - r * (0.5 + 0.5 * band));
  outColor = vec4(mix(vec3(0.05, 0.08, 0.12), vec3(0.9, 0.6, 0.2), ring), 1.0);
}`;

const canvas = document.getElementById('gl');
const errEl  = document.getElementById('err');
const gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: false });
if (!gl) {
  errEl.style.display = 'block';
  errEl.textContent = 'WebGL2 unavailable. gmk shader prototypes require WebGL2; this device/browser cannot run shape=shader.';
}

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    errEl.style.display = 'block';
    errEl.textContent = 'shader compile error:\n' + log;
    throw new Error('shader compile error: ' + log);
  }
  return sh;
}

let program, uTime, uMix, uRes;
if (gl) {
  const vs = compile(gl.VERTEX_SHADER, VERT_SRC);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
  program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(program);
    errEl.style.display = 'block';
    errEl.textContent = 'program link error:\n' + log;
    throw new Error('program link error: ' + log);
  }
  uTime = gl.getUniformLocation(program, 'uTime');
  uMix  = gl.getUniformLocation(program, 'uMix');
  uRes  = gl.getUniformLocation(program, 'uRes');
  // One fullscreen triangle (3 verts, no indices).
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
}

// RENDER LOOP (for human play; bot reads state, not pixels).
const tEl = document.getElementById('t');
const xEl = document.getElementById('x');
const intEl = document.getElementById('interactions');
const statusEl = document.getElementById('status');
let rafId = 0;
let mixBins = new Set();  // coverage of [0..1] in 10 bins

function resize() {
  if (!gl) return;
  const w = canvas.clientWidth | 0, h = canvas.clientHeight | 0;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

function renderFrame() {
  if (!state || !gl) return;
  resize();
  // Bot drives state.mix; trail catches up here for smooth display.
  state.trail += (state.mix - state.trail) * 0.15;

  gl.useProgram(program);
  gl.uniform1f(uTime, performance.now() / 1000);
  gl.uniform1f(uMix, state.trail);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // mix-bin coverage updates whether human or bot is driving.
  const bin = Math.min(9, Math.floor(state.mix * 10));
  mixBins.add(bin);
  state.mix_bin_visits = mixBins.size;

  tEl.textContent   = ((performance.now() - state.started_ms) / 1000).toFixed(2);
  xEl.textContent   = state.mix.toFixed(2);
  intEl.textContent = state.interactions;
  statusEl.textContent = state.over ? ('over (' + state.over_reason + ')') : 'running';

  rafId = requestAnimationFrame(renderFrame);
}

// HUMAN INPUT (drag horizontally, or scroll).
let dragging = false;
canvas.addEventListener('pointerdown', (e) => {
  if (!state || state.over) return;
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging || !state || state.over) return;
  const rect = canvas.getBoundingClientRect();
  const next = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (Math.abs(next - state.mix) >= MIX_STEP / 2) {
    state.mix = next;
    state.interactions++;
  }
});
canvas.addEventListener('wheel', (e) => {
  if (!state || state.over) return;
  e.preventDefault();
  state.mix = Math.max(0, Math.min(1, state.mix + Math.sign(e.deltaY) * MIX_STEP));
  state.interactions++;
}, { passive: false });

// BOT HOOK BINDING — DO NOT MODIFY.
// _bot_hook_lib.js exposes window.__gmk.makeHook; we bind the 5-callback spec to game logic above.
// shader-shape: legalActions returns 3 abstract actions; action_entropy across them is the only
// bot-objective signal. Verdict is INCONCLUSIVE — falsification goes through /gmk-self-test.
window.__gmk_botHook__ = window.__gmk.makeHook({
  reset(seed, rng) {
    state = newState(seed, rng);
    state.started_ms = performance.now();
    mixBins = new Set();
    if (rafId) cancelAnimationFrame(rafId);
    if (gl) rafId = requestAnimationFrame(renderFrame);
  },
  isOver() { return state.over; },
  legalActions() { return computeLegalActions(state); },
  apply(action) { applyAction(state, action); },  // no render in apply — bots run headless
  collectSummary() { return summarize(state); },
  // Optional v0.2 callbacks for suspicious-run extraction. Returning null is fine.
  stateSignature() {
    if (!state) return null;
    return Math.round(state.mix * 20) + ':' + Math.floor(state.sim_ms / 5000);
  },
  progressEstimate() {
    if (!state) return null;
    return Math.min(1, state.sim_ms / (RUN_SECONDS * 1000));
  },
  // riskEstimate / noveltyScore omitted — shader prototypes have no risk; novelty is uMix delta
  // which the harness already computes from stateSignature transitions.
});

window.__gmk_botHook__.startGame(Date.now() & 0xffff);
</script>
</body>
</html>
